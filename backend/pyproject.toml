[project]
name = "creator-signal-backend"
version = "0.1.0"
description = "Backend for the Creator Signal prototype"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116.0",
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
